name: Nightly policy-value self training

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: model-training-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AlphaZero regression tests
        run: python -m unittest discover -s ml/tests -p "test_*.py"
      - name: Generate neural MCTS self-play games
        env:
          AZ_SELF_PLAY_GAMES: "32"
          AZ_SELF_PLAY_BATCH_SIZE: "8"
          AZ_MCTS_SEARCHES: "160"
          AZ_MAX_SELF_PLAY_SAMPLES: "60000"
          AZ_START_POSITION_FRACTION: "0.50"
          AZ_START_POSITION_MAX_CP: "150"
          AZ_SELF_PLAY_SEED: ${{ github.run_number }}
        run: python ml/self_play.py
      - name: Continue policy-value learning, evaluate, and export model
        env:
          TRAIN_SEED: ${{ github.run_number }}
          AZ_MAX_SELF_PLAY_TRAIN: "24000"
          AZ_MAX_STOCKFISH_TRAIN: "32000"
          AZ_STOCKFISH_POLICY_WEIGHT: "1.0"
          AZ_MERGE_FRESH_STOCKFISH_LABELS: "0"
          CONTINUE_EPOCHS: "4"
          AZ_ARENA_GAMES: "48"
          AZ_ARENA_SEARCHES: "48"
          AZ_ARENA_MAX_PLIES: "120"
          AZ_ARENA_MIN_SCORE: "0.50"
          AZ_ARENA_MIN_DECISIVE_GAMES: "8"
          AZ_ARENA_MAX_START_CP: "150"
          AZ_MCTS_EVAL_POSITIONS: "192"
          AZ_MCTS_EVAL_SEARCHES: "64"
          AZ_MIN_MCTS_ALIGNMENT_IMPROVEMENT: "0.0001"
          AZ_MIN_MCTS_TOP_MOVE_IMPROVEMENT: "0.0"
        run: python ml/train_safe_export.py
      - name: Commit updated model state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_model_artifacts.sh ml/data/self_play_buffer.json
          git add public/nn ml/checkpoints ml/data/self_play_buffer.json ml/data/fixed_eval_set_v3.json ml/training_history.json
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi
          git commit -m "Nightly: continue self training"
          git push
