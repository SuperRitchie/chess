name: Nightly policy-value self training

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: model-training-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AlphaZero regression tests
        run: python -m unittest discover -s ml/tests -p "test_*.py"
      - name: Generate neural MCTS self-play games
        env:
          AZ_SELF_PLAY_GAMES: "32"
          AZ_SELF_PLAY_BATCH_SIZE: "8"
          AZ_MCTS_SEARCHES: "160"
          AZ_MAX_SELF_PLAY_SAMPLES: "60000"
          AZ_START_POSITION_FRACTION: "0.50"
          AZ_START_POSITION_MAX_CP: "150"
          AZ_SELF_PLAY_SEED: ${{ github.run_number }}
        run: python ml/self_play.py
      # This snapshot includes old replay rows; it is not a count of newly generated samples.
      - name: Preserve generated self-play replay
        uses: actions/upload-artifact@v7
        with:
          name: self-play-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ml/data/self_play_buffer.json
          if-no-files-found: error
          retention-days: 14
      - name: Continue policy-value learning, evaluate, and export model
        id: train
        env:
          TRAIN_RUN_KIND: self_play
          TRAIN_SEED: ${{ github.run_number }}
          AZ_MAX_SELF_PLAY_TRAIN: "24000"
          AZ_MAX_STOCKFISH_TRAIN: "32000"
          AZ_STOCKFISH_POLICY_WEIGHT: "1.0"
          AZ_MERGE_FRESH_STOCKFISH_LABELS: "0"
          CONTINUE_EPOCHS: "4"
          AZ_ARENA_GAMES: "48"
          AZ_ARENA_SEARCHES: "48"
          AZ_ARENA_MAX_PLIES: "160"
          AZ_ARENA_MIN_SCORE: "0.50"
          AZ_ARENA_MIN_DECISIVE_GAMES: "12"
          AZ_ARENA_MIN_DECISIVE_WIN_RATE_LCB: "0.50"
          AZ_ARENA_BALANCED_FRACTION: "0.50"
          AZ_ARENA_MIN_CONVERSION_CP: "200"
          AZ_ARENA_MAX_START_CP: "800"
          AZ_NN_EVAL_POSITIONS: "192"
          AZ_MIN_NN_ALIGNMENT_IMPROVEMENT: "0.0001"
          AZ_MIN_NN_TOP_MOVE_IMPROVEMENT: "0.0"
          AZ_MCTS_EVAL_POSITIONS: "192"
          AZ_MCTS_EVAL_SEARCHES: "64"
          AZ_MIN_MCTS_ALIGNMENT_IMPROVEMENT: "0.0001"
          AZ_MIN_MCTS_TOP_MOVE_IMPROVEMENT: "0.0"
        run: |
          set -o pipefail
          python ml/train_safe_export.py 2>&1 | tee "$RUNNER_TEMP/nightly-training.log"
      - name: Preserve training evidence
        if: ${{ always() && steps.train.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: self-play-training-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nightly-training.log
            ml/training_history.json
            public/nn/model.json
            public/nn/group*.bin
          if-no-files-found: warn
          retention-days: 14
      - name: Commit updated model state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/stage_model_artifacts.sh ml/data/self_play_buffer.json
          git add public/nn ml/checkpoints ml/data/self_play_buffer.json ml/data/fixed_eval_set_v3.json ml/training_history.json
          if git diff --cached --quiet; then
            echo "No model changes to commit"
            exit 0
          fi
          git commit -m "Nightly: continue self training"
          git push
