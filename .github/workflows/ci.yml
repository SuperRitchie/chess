name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run AlphaZero regression tests
        run: python -m unittest discover -s ml/tests -p "test_*.py"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Run browser tests
        env:
          CI: true
        run: |
          set -o pipefail
          npm test -- --watchAll=false 2>&1 | tee browser-test.log
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-log
          path: browser-test.log
          if-no-files-found: warn
      - name: Optimize browser neural model
        run: python3 scripts/quantize_tfjs_model.py public/nn/model.json
      - name: Build production site
        run: npm run build

  patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate unified patch
        run: git diff --binary "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > chess-alphazero-correctness.patch
      - name: Upload patch
        uses: actions/upload-artifact@v7
        with:
          name: chess-alphazero-correctness-patch
          path: chess-alphazero-correctness.patch
          if-no-files-found: error
